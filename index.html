<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Court Booking</title>
    <meta name="description" content="A court-booking product for Project 831, built from coss ui components." />
    <script>
      // Apply a saved theme before first paint, so dark-mode viewers never see a white flash.
      try {
        const theme = localStorage.getItem("slot-picker:theme");
        const system = !theme && matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || system) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
